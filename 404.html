<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>404 · 页面不存在</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fdfcfa;
    color: #1f1f1d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  .box { text-align: center; }
  .code {
    font-size: 72px;
    font-weight: 600;
    letter-spacing: -2px;
    color: #d3d1c7;
    line-height: 1;
    margin-bottom: 16px;
  }
  p { color: #5f5e5a; font-size: 15px; margin: 0 0 20px; }
  a {
    display: inline-block;
    color: #185fa5;
    text-decoration: none;
    font-size: 15px;
    border-bottom: 1px solid currentColor;
    padding-bottom: 2px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16161a; color: #f0efe9; }
    .code { color: #2e2e34; }
    p { color: #b4b2a9; }
    a { color: #85b7eb; }
  }
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <p>这条路上没有东西。</p>
  <a href="/">回首页</a>
</div>
</body>
</html>
